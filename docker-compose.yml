version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gin-boilerplate-postgres
    environment:
      POSTGRES_DB: gin_boilerplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gin-boilerplate-network

  # Redis (optional)
  redis:
    image: redis:7-alpine
    container_name: gin-boilerplate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gin-boilerplate-network

  # Application
  app:
    build: .
    container_name: gin-boilerplate-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=gin_boilerplate
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=your-production-secret-key
    depends_on:
      - postgres
      - redis
    networks:
      - gin-boilerplate-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  gin-boilerplate-network:
    driver: bridge
